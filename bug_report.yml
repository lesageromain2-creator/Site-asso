name: 🐞 Signaler un bug
description: Décris ici un problème rencontré sur le site ou l'application
title: "[BUG] Décris brièvement le problème"
labels: ["bug"]
assignees: [] # Tu peux ajouter ton pseudo GitHub ici pour assigner automatiquement

body:
  - type: markdown
    attributes:
      value: |
        Merci de remplir ce formulaire afin qu'on puisse reproduire et corriger le bug plus facilement 🙏  
        *(Les champs marqués d’une étoile sont obligatoires)*

  - type: input
    id: summary
    attributes:
      label: 📝 Résumé du bug *
      description: Résume en une phrase le problème rencontré.
      placeholder: Ex. "Impossible de s'inscrire avec une adresse Gmail"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔍 Étapes pour reproduire le bug *
      description: Liste les étapes précises pour reproduire le problème.
      placeholder: |
        1. Aller sur la page d’inscription
        2. Remplir le formulaire
        3. Cliquer sur “S'inscrire”
        4. L’erreur apparaît
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Résultat attendu
      placeholder: Ex. "L’utilisateur devrait être redirigé vers le tableau de bord."

  - type: textarea
    id: actual
    attributes:
      label: ❌ Résultat observé
      placeholder: Ex. "Un message d’erreur '500 Internal Server Error' s’affiche."

  - type: input
    id: environment
    attributes:
      label: 🖥️ Environnement
      description: Indique ton navigateur, ton appareil ou ton OS.
      placeholder: Ex. "Chrome 129 sur Windows 11"

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 Captures d’écran
      description: Si possible, ajoute une capture ou une vidéo du problème.
      placeholder: Glisse-dépose ton image ici.

  - type: textarea
    id: notes
    attributes:
      label: 💬 Informations supplémentaires
      description: Ajoute ici des logs, messages d’erreur ou autres détails utiles.
